[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundstelle"
version = "0.1.0"
description = "Answers to German legal questions where every sentence cites a statute it is checked against."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Doğa Paksoy" }]
dependencies = [
    "numpy",
    "snowballstemmer>=2.2",
    "pydantic>=2.5",
]

[project.optional-dependencies]
retrieval = [
    "torch>=2.1",
    "sentence-transformers>=3.0",
    "huggingface_hub>=0.23",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fundstelle = "fundstelle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fundstelle"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
